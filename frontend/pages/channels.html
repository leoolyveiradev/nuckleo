<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuckleo — Canais</title>
    <link rel="stylesheet" href="../style.css" />
</head>
<body data-page="channels" data-page-path="pages">
    <div class="app-shell">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main-wrapper">
            <header class="topbar" id="topbar"></header>
            <main class="page-content" id="channels-content"></main>
        </div>
    </div>
    <nav class="bottom-nav" id="bottom-nav"></nav>
    <button class="ai-fab" id="ai-fab" aria-label="Agente IA">✦</button>
    <div class="ai-panel" id="ai-panel">
        <div class="ai-panel-header">Agente Nuckleo <button id="ai-close">✕</button></div>
        <div class="ai-panel-messages" id="ai-messages"><p>Como posso ajudar?</p></div>
        <form class="ai-panel-input" id="ai-form">
            <input type="text" id="ai-input" placeholder="Sua dúvida..." />
            <button type="submit" class="btn-primary">→</button>
        </form>
    </div>
    <script src="../componentes/icons.js"></script>
    <script src="../componentes/layout.js"></script>
    <script src="../app.js"></script>
    <script src="../componentes/cards.js"></script>
    <script src="../componentes/modals.js"></script>
    <script>
/**
 * Channels - Canais temáticos (educação e tech)
 */

const NuckleoChannels = {
    state: {
        channels: [],
        items: [],
        loading: false,
        activeChannel: null,
        user: null,
    },

    defaultChannels: [
        { id: 'prog', name: 'Programação', description: 'Discussões sobre código e desenvolvimento', icon: 'code', color: '#6366f1', category: 'tech' },
        { id: 'ai', name: 'Inteligência Artificial', description: 'Machine learning, LLMs e IA', icon: 'brain', color: '#ec4899', category: 'tech' },
        { id: 'web', name: 'Desenvolvimento Web', description: 'Frontend, backend e APIs', icon: 'globe', color: '#14b8a6', category: 'tech' },
        { id: 'mobile', name: 'Mobile', description: 'iOS, Android e apps', icon: 'smartphone', color: '#f59e0b', category: 'tech' },
        { id: 'devops', name: 'DevOps', description: 'CI/CD, cloud e infraestrutura', icon: 'server', color: '#22c55e', category: 'tech' },
        { id: 'math', name: 'Matemática', description: 'Álgebra, cálculo e mais', icon: 'calculator', color: '#3b82f6', category: 'education' },
        { id: 'physics', name: 'Física', description: 'Mecânica, quântica e física', icon: 'atom', color: '#8b5cf6', category: 'education' },
        { id: 'science', name: 'Ciências', description: 'Química, biologia e natureza', icon: 'flask-conical', color: '#ef4444', category: 'education' },
        { id: 'study', name: 'Métodos de Estudo', description: 'Técnicas e produtividade', icon: 'book-open', color: '#6366f1', category: 'education' },
        { id: 'career', name: 'Carreira Tech', description: 'Entrevistas e mercado', icon: 'briefcase', color: '#14b8a6', category: 'education' },
    ],

    async init() {
        const user = JSON.parse(localStorage.getItem('nuckleo_user') || '{}');
        this.state.user = user;
        await this.loadData();
        this.render();
    },

    async loadData() {
        this.state.loading = true;
        this.render();

        try {
            const res = await window.Nuckleo.apiFetch('/channels');
            this.state.channels = Array.isArray(res) ? res : [];
            // Carrega itens do canal ativo
            if (this.state.activeChannel) {
                const itemsRes = await window.Nuckleo.apiFetch('/items?channel=' + this.state.activeChannel);
                this.state.items = Array.isArray(itemsRes) ? itemsRes : [];
            }
        } catch (e) {
            this.state.channels = [];
            this.state.items = [];
        }

        this.state.loading = false;
    },

    getChannelItems(channelId) {
        return this.state.items.filter(item => item.channel === channelId);
    },

    setActiveChannel(channelId) {
        this.state.activeChannel = channelId === this.state.activeChannel ? null : channelId;
        this.loadData();
    },

    async createChannel(name, description, category, icon, color) {
        if (!name.trim()) return;

        const channel = {
            name: name.trim(),
            description: description || '',
            category: category || 'tech',
            icon: icon || 'hash',
            color: color || '#6366f1',
            created_at: new Date().toISOString(),
        };

        await window.Nuckleo.apiFetch('/channels', {
            method: 'POST',
            body: JSON.stringify(channel),
        });

        await this.loadData();
    },

    async deleteChannel(channelId) {
        await window.Nuckleo.apiFetch('/channels/' + channelId, {
            method: 'DELETE',
        });
        await this.loadData();
    },

    render() {
        const content = document.getElementById('channels-content');
        if (!content) return;

        const allChannels = [...this.defaultChannels, ...this.state.channels];
        const techChannels = allChannels.filter(c => c.category === 'tech');
        const eduChannels = allChannels.filter(c => c.category === 'education');

        content.innerHTML = `
            <div class="page-header">
                <h1>${NuckleoIcons.icon('radio', 'icon')} Canais</h1>
                <p class="text-muted">Comunidades temáticas</p>
            </div>

            <button class="btn-primary" onclick="NuckleoChannels.showCreateModal()" style="margin-bottom:1rem;">
                ${NuckleoIcons.icon('plus', 'icon-xs')} Novo Canal
            </button>
        `;

        if (this.state.loading) {
            content.innerHTML += '<div class="loading">Carregando...</div>';
            return;
        }

        // Categoria Tech
        content.innerHTML += `
            <h2 style="font-size:0.875rem;margin:1.5rem 0 0.75rem;color:var(--primary);display:flex;align-items:center;gap:0.5rem;">
                ${NuckleoIcons.icon('cpu', 'icon-sm')} Mundo Tech
            </h2>
            <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:0.75rem;">
                ${techChannels.map(ch => this.renderChannelCard(ch)).join('')}
            </div>
        `;

        // Categoria Educação
        content.innerHTML += `
            <h2 style="font-size:0.875rem;margin:1.5rem 0 0.75rem;color:var(--secondary);display:flex;align-items:center;gap:0.5rem;">
                ${NuckleoIcons.icon('graduation-cap', 'icon-sm')} Educação
            </h2>
            <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:0.75rem;">
                ${eduChannels.map(ch => this.renderChannelCard(ch)).join('')}
            </div>
        `;

        // Itens do canal ativo
        if (this.state.activeChannel) {
            const activeCh = allChannels.find(c => c.id === this.state.activeChannel);
            const channelItems = this.getChannelItems(this.state.activeChannel);

            content.innerHTML += `
                <div style="margin-top:1.5rem;padding:1rem;border:1px solid ${activeCh?.color || 'var(--border)'};border-radius:0.75rem;">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
                        <strong>${activeCh?.name || 'Canal'}</strong>
                        <button class="btn-ghost btn-sm" onclick="NuckleoChannels.setActiveChannel(null)">${NuckleoIcons.icon('x', 'icon-xs')}</button>
                    </div>
                    <p class="text-muted" style="margin-bottom:1rem;">${activeCh?.description || ''}</p>
                    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:0.5rem;">
                        ${channelItems.length ? channelItems.map(item => window.NuckleoCards.renderItemCard(item)).join('') : '<p class="text-dim-sm">Nenhum item neste canal.</p>'}
                    </div>
                </div>
            `;
        }

        NuckleoIcons.refreshIcons();
    },

    renderChannelCard(ch) {
        const isActive = this.state.activeChannel === ch.id;
        return `
            <div class="card" onclick="NuckleoChannels.setActiveChannel('${ch.id}')" style="cursor:pointer;padding:1rem;border-left:3px solid ${ch.color};${isActive ? 'background:' + ch.color + '11' : ''}">
                <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.375rem;">
                    ${NuckleoIcons.icon(ch.icon || 'hash', 'icon-sm')}
                    <strong style="font-size:0.875rem;">${ch.name}</strong>
                </div>
                <p class="text-muted" style="font-size:0.75rem;">${ch.description || ''}</p>
            </div>
        `;
    },

    showCreateModal() {
        const categoryOptions = [
            { value: 'tech', label: 'Mundo Tech' },
            { value: 'education', label: 'Educação' },
        ];
        const iconOptions = [
            { value: 'code', label: 'Code' },
            { value: 'brain', label: 'IA' },
            { value: 'globe', label: 'Web' },
            { value: 'smartphone', label: 'Mobile' },
            { value: 'server', label: 'Server' },
            { value: 'calculator', label: 'Math' },
            { value: 'atom', label: 'Physics' },
            { value: 'flask-conical', label: 'Science' },
            { value: 'book-open', label: 'Study' },
            { value: 'briefcase', label: 'Career' },
        ];

        const modal = window.NuckleoModals.create({
            title: 'Novo Canal',
            content: `
                <div style="display:flex;flex-direction:column;gap:1rem;">
                    <div>
                        <label style="display:block;font-size:0.75rem;margin-bottom:0.375rem;">Nome</label>
                        <input type="text" id="channel-name" placeholder="Nome do canal..." style="width:100%;padding:0.5rem;border-radius:0.5rem;border:1px solid var(--border);background:var(--bg);" />
                    </div>
                    <div>
                        <label style="display:block;font-size:0.75rem;margin-bottom:0.375rem;">Descrição</label>
                        <input type="text" id="channel-desc" placeholder="Descrição..." style="width:100%;padding:0.5rem;border-radius:0.5rem;border:1px solid var(--border);background:var(--bg);" />
                    </div>
                    <div>
                        <label style="display:block;font-size:0.75rem;margin-bottom:0.375rem;">Categoria</label>
                        <select id="channel-category" style="width:100%;padding:0.5rem;border-radius:0.5rem;border:1px solid var(--border);background:var(--bg);">
                            ${categoryOptions.map(c => `<option value="${c.value}">${c.label}</option>`).join('')}
                        </select>
                    </div>
                </div>
            `,
            onConfirm: async () => {
                const name = document.getElementById('channel-name').value;
                const desc = document.getElementById('channel-desc').value;
                const category = document.getElementById('channel-category').value;
                await this.createChannel(name, desc, category);
            },
        });

        window.NuckleoModals.show(modal);
    },
};

window.NuckleoChannels = NuckleoChannels;

document.addEventListener('DOMContentLoaded', () => NuckleoChannels.init());
    </script>
</body>
</html>
