<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuckleo — Tags</title>
    <link rel="stylesheet" href="../style.css" />
</head>
<body data-page="tags" data-page-path="pages">
    <div class="app-shell">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main-wrapper">
            <header class="topbar" id="topbar"></header>
            <main class="page-content" id="tags-content"></main>
        </div>
    </div>
    <nav class="bottom-nav" id="bottom-nav"></nav>
    <button class="ai-fab" id="ai-fab" aria-label="Agente IA">✦</button>
    <div class="ai-panel" id="ai-panel">
        <div class="ai-panel-header">Agente Nuckleo <button id="ai-close">✕</button></div>
        <div class="ai-panel-messages" id="ai-messages"><p>Como posso ajudar?</p></div>
        <form class="ai-panel-input" id="ai-form">
            <input type="text" id="ai-input" placeholder="Sua dúvida..." />
            <button type="submit" class="btn-primary">→</button>
        </form>
    </div>
    <script src="../componentes/icons.js"></script>
    <script src="../componentes/layout.js"></script>
    <script src="../app.js"></script>
    <script src="../componentes/cards.js"></script>
    <script src="../componentes/modals.js"></script>
    <script>
/**
 * Tags - Gerenciar tags para organizar e filtrar conteúdo
 */

const NuckleoTags = {
    state: {
        tags: [],
        items: [],
        loading: false,
        filterTag: null,
    },

    async init() {
        await this.loadData();
        this.render();
    },

    async loadData() {
        this.state.loading = true;
        this.render();

        try {
            const [tagsRes, itemsRes] = await Promise.all([
                window.Nuckleo.apiFetch('/tags'),
                window.Nuckleo.apiFetch('/items'),
            ]);
            this.state.tags = Array.isArray(tagsRes) ? tagsRes : [];
            this.state.items = Array.isArray(itemsRes) ? itemsRes : [];
        } catch (e) {
            this.state.tags = [];
            this.state.items = [];
        }

        this.state.loading = false;
    },

    getTagItems(tagName) {
        return this.state.items.filter(item =>
            item.tags && item.tags.includes(tagName)
        );
    },

    setFilter(tagName) {
        this.state.filterTag = tagName === this.state.filterTag ? null : tagName;
        this.render();
    },

    async createTag(name, color) {
        if (!name.trim()) return;

        const tag = {
            name: name.trim(),
            color: color || '#6366f1',
            created_at: new Date().toISOString(),
        };

        await window.Nuckleo.apiFetch('/tags', {
            method: 'POST',
            body: JSON.stringify(tag),
        });

        await this.loadData();
    },

    async deleteTag(tagName) {
        await window.Nuckleo.apiFetch('/tags/' + encodeURIComponent(tagName), {
            method: 'DELETE',
        });
        await this.loadData();
    },

    render() {
        const content = document.getElementById('tags-content');
        if (!content) return;

        const tagItems = this.state.filterTag ? this.getTagItems(this.state.filterTag) : [];

        content.innerHTML = `
            <div class="page-header">
                <h1>${NuckleoIcons.icon('tag', 'icon')} Tags</h1>
                <p class="text-muted">Organize e filtre seu conteúdo com tags</p>
            </div>

            <div style="display:flex;gap:0.5rem;margin-bottom:1rem;flex-wrap:wrap;">
                <button class="btn-primary" onclick="NuckleoTags.showCreateModal()">
                    ${NuckleoIcons.icon('plus', 'icon-xs')} Nova Tag
                </button>
            </div>
        `;

        if (this.state.loading) {
            content.innerHTML += '<div class="loading">Carregando...</div>';
            return;
        }

        if (this.state.tags.length === 0) {
            content.innerHTML += `
                <div class="empty-state">
                    ${NuckleoIcons.icon('tag', 'icon-lg')}
                    <p>Nenhuma tag ainda.</p>
                    <p class="text-dim-sm">Crie tags para organizar seus itens!</p>
                </div>
            `;
            return;
        }

        // Lista de tags
        content.innerHTML += `
            <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:1.5rem;">
                ${this.state.tags.map(tag => `
                    <span class="badge" style="background:${tag.color}22;color:${tag.color};padding:0.375rem 0.75rem;border-radius:999px;font-size:0.8125rem;cursor:pointer;${this.state.filterTag === tag.name ? 'outline:2px solid ' + tag.color : ''}"
                          onclick="NuckleoTags.setFilter('${tag.name}')">
                        ${tag.name}
                        <span onclick="event.stopPropagation();NuckleoTags.deleteTag('${tag.name}')" style="margin-left:0.375rem;opacity:0.6;">✕</span>
                    </span>
                `).join('')}
            </div>
        `;

        // Itens filtrados
        if (this.state.filterTag) {
            content.innerHTML += `
                <h2 style="font-size:0.875rem;margin-bottom:0.75rem;">Itens com "${this.state.filterTag}" (${tagItems.length})</h2>
                <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:0.75rem;">
                    ${tagItems.length ? tagItems.map(item => window.NuckleoCards.renderItemCard(item)).join('') : '<p class="text-muted">Nenhum item com esta tag.</p>'}
                </div>
            `;
        }

        NuckleoIcons.refreshIcons();
    },

    showCreateModal() {
        const colorOptions = ['#6366f1', '#ec4899', '#14b8a6', '#f59e0b', '#ef4444', '#22c55e', '#3b82f6', '#8b5cf6'];
        let selectedColor = colorOptions[0];

        const modal = window.NuckleoModals.create({
            title: 'Nova Tag',
            content: `
                <div style="display:flex;flex-direction:column;gap:1rem;">
                    <div>
                        <label style="display:block;font-size:0.75rem;margin-bottom:0.375rem;">Nome</label>
                        <input type="text" id="tag-name-input" placeholder="ex: importante, trabalho..." style="width:100%;padding:0.5rem;border-radius:0.5rem;border:1px solid var(--border);background:var(--bg);" />
                    </div>
                    <div>
                        <label style="display:block;font-size:0.75rem;margin-bottom:0.375rem;">Cor</label>
                        <div style="display:flex;gap:0.5rem;" id="color-picker">
                            ${colorOptions.map(c => `
                                <button type="button" data-color="${c}" style="width:1.5rem;height:1.5rem;border-radius:50%;background:${c};border:2px solid transparent;cursor:pointer;" onclick="document.querySelectorAll('#color-picker button').forEach(b=>b.style.border='transparent');this.style.border='white';selectedColor='${c}'"></button>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `,
            onConfirm: async () => {
                const name = document.getElementById('tag-name-input').value;
                await this.createTag(name, selectedColor);
            },
        });

        window.NuckleoModals.show(modal);
    },
};

window.NuckleoTags = NuckleoTags;

document.addEventListener('DOMContentLoaded', () => NuckleoTags.init());
    </script>
</body>
</html>
