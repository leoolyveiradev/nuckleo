<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuckleo — Cursos</title>
    <link rel="stylesheet" href="../style.css" />
</head>
<body data-page="courses" data-page-path="pages">
    <div class="app-shell">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main-wrapper">
            <header class="topbar" id="topbar"></header>
            <main class="page-content" id="courses-content"></main>
        </div>
    </div>
    <nav class="bottom-nav" id="bottom-nav"></nav>
    <button class="ai-fab" id="ai-fab" aria-label="Agente IA">✦</button>
    <div class="ai-panel" id="ai-panel">
        <div class="ai-panel-header">Agente Nuckleo <button id="ai-close">✕</button></div>
        <div class="ai-panel-messages" id="ai-messages"><p>Como posso ajudar?</p></div>
        <form class="ai-panel-input" id="ai-form">
            <input type="text" id="ai-input" placeholder="Sua dúvida..." />
            <button type="submit" class="btn-primary">→</button>
        </form>
    </div>
    <script src="../componentes/icons.js"></script>
    <script src="../componentes/layout.js"></script>
    <script src="../app.js"></script>
    <script src="../componentes/cards.js"></script>
    <script src="../componentes/modals.js"></script>
    <script>
/**
 * Courses - Gerenciamento de cursos e trilhas
 */

const NuckleoCourses = {
    state: {
        courses: [],
        loading: false,
        filter: 'all',
    },

    async init() {
        await this.loadData();
        this.render();
    },

    async loadData() {
        this.state.loading = true;
        this.render();

        try {
            const res = await window.Nuckleo.apiFetch('/items?type=course');
            this.state.courses = Array.isArray(res) ? res : [];
        } catch (e) {
            this.state.courses = [];
        }

        this.state.loading = false;
    },

    setFilter(filter) {
        this.state.filter = filter;
        this.render();
    },

    async createCourse(title, platform, progress, link) {
        if (!title.trim()) return;

        const course = {
            title: title.trim(),
            platform: platform || '',
            progress: progress || 0,
            link: link || '',
            type: 'course',
            created_at: new Date().toISOString(),
        };

        await window.Nuckleo.apiFetch('/items', {
            method: 'POST',
            body: JSON.stringify(course),
        });

        await this.loadData();
    },

    async updateCourse(id, data) {
        await window.Nuckleo.apiFetch('/items/' + id, {
            method: 'PATCH',
            body: JSON.stringify(data),
        });
        await this.loadData();
    },

    async deleteCourse(id) {
        await window.Nuckleo.apiFetch('/items/' + id, {
            method: 'DELETE',
        });
        await this.loadData();
    },

    getStatusLabel(status) {
        const labels = { 'to-start': 'A começar', 'in-progress': 'Em andamento', completed: 'Concluído' };
        return labels[status] || status;
    },

    getStatusFromProgress(progress) {
        if (progress === 0) return 'to-start';
        if (progress >= 100) return 'completed';
        return 'in-progress';
    },

    getStatusColor(status) {
        const colors = { 'to-start': '#6366f1', 'in-progress': '#f59e0b', completed: '#22c55e' };
        return colors[status] || '#6366f1';
    },

    render() {
        const content = document.getElementById('courses-content');
        if (!content) return;

        const filtered = this.state.filter === 'all'
            ? this.state.courses
            : this.state.courses.filter(c => this.getStatusFromProgress(c.progress || 0) === this.state.filter);

        content.innerHTML = `
            <div class="page-header">
                <h1>${NuckleoIcons.icon('graduation-cap', 'icon')} Cursos</h1>
                <p class="text-muted">Suas trilhas de aprendizado</p>
            </div>

            <button class="btn-primary" onclick="NuckleoCourses.showCourseModal()" style="margin-bottom:1rem;">
                ${NuckleoIcons.icon('plus', 'icon-xs')} Novo Curso
            </button>

            <div style="display:flex;gap:0.5rem;margin-bottom:1rem;">
                ${['all', 'to-start', 'in-progress', 'completed'].map(s => `
                    <button class="tab ${this.state.filter === s ? 'active' : ''}" onclick="NuckleoCourses.setFilter('${s}')">
                        ${s === 'all' ? 'Todos' : this.getStatusLabel(s)}
                    </button>
                `).join('')}
            </div>
        `;

        if (this.state.loading) {
            content.innerHTML += '<div class="loading">Carregando...</div>';
            return;
        }

        if (filtered.length === 0) {
            content.innerHTML += `
                <div class="empty-state">
                    ${NuckleoIcons.icon('graduation-cap', 'icon-lg')}
                    <p>Nenhum curso ainda.</p>
                    <p class="text-dim-sm">Adicione seus cursos!</p>
                </div>
            `;
            return;
        }

        content.innerHTML += `
            <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem;">
                ${filtered.map(course => {
                    const progress = course.progress || 0;
                    const status = this.getStatusFromProgress(progress);
                    return `
                        <div class="card" style="padding:1rem;">
                            <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:0.5rem;">
                                <span class="badge" style="background:${this.getStatusColor(status)}22;color:${this.getStatusColor(status)}">
                                    ${this.getStatusLabel(status)}
                                </span>
                                <div style="display:flex;gap:0.25rem;">
                                    <button class="btn-ghost btn-xs" onclick="NuckleoCourses.showCourseModal(${course.id}, ${JSON.stringify(course.title).replace(/"/g, '&quot;')}, ${JSON.stringify(course.platform || '').replace(/"/g, '&quot;')}, ${course.progress || 0}, ${JSON.stringify(course.link || '').replace(/"/g, '&quot;')})">${NuckleoIcons.icon('pencil', 'icon-xs')}</button>
                                    <button class="btn-ghost btn-xs" onclick="NuckleoCourses.deleteCourse(${course.id})">${NuckleoIcons.icon('trash-2', 'icon-xs')}</button>
                                </div>
                            </div>
                            <h3 style="font-size:0.9375rem;font-weight:600;margin-bottom:0.25rem;">${course.title}</h3>
                            <p class="text-muted" style="font-size:0.8125rem;margin-bottom:0.75rem;">${course.platform || 'Plataforma não especificada'}</p>
                            <div style="background:var(--bg-secondary);border-radius:0.5rem;height:0.5rem;overflow:hidden;margin-bottom:0.5rem;">
                                <div style="width:${progress}%;height:100%;background:var(--primary);transition:width 0.3s;"></div>
                            </div>
                            <p class="text-dim-sm" style="font-size:0.75rem;">${progress}% completo</p>
                            ${course.link ? `<a href="${course.link}" target="_blank" style="font-size:0.75rem;color:var(--primary);display:block;margin-top:0.5rem;">Acessar curso →</a>` : ''}
                        </div>
                    `;
                }).join('')}
            </div>
        `;

        NuckleoIcons.refreshIcons();
    },

    showCourseModal(id = null, title = '', platform = '', progress = 0, link = '') {
        const isEdit = id !== null;
        const modal = window.NuckleoModals.create({
            title: isEdit ? 'Editar Curso' : 'Novo Curso',
            content: `
                <div style="display:flex;flex-direction:column;gap:1rem;">
                    <div>
                        <label style="display:block;font-size:0.75rem;margin-bottom:0.375rem;">Título</label>
                        <input type="text" id="course-title" value="${title}" placeholder="Nome do curso..." style="width:100%;padding:0.5rem;border-radius:0.5rem;border:1px solid var(--border);background:var(--bg);" />
                    </div>
                    <div>
                        <label style="display:block;font-size:0.75rem;margin-bottom:0.375rem;">Plataforma</label>
                        <input type="text" id="course-platform" value="${platform}" placeholder="ex: Udemy, Coursera..." style="width:100%;padding:0.5rem;border-radius:0.5rem;border:1px solid var(--border);background:var(--bg);" />
                    </div>
                    <div>
                        <label style="display:block;font-size:0.75rem;margin-bottom:0.375rem;">Progresso (%)</label>
                        <input type="number" id="course-progress" value="${progress}" min="0" max="100" style="width:100%;padding:0.5rem;border-radius:0.5rem;border:1px solid var(--border);background:var(--bg);" />
                    </div>
                    <div>
                        <label style="display:block;font-size:0.75rem;margin-bottom:0.375rem;">Link (opcional)</label>
                        <input type="url" id="course-link" value="${link}" placeholder="https://..." style="width:100%;padding:0.5rem;border-radius:0.5rem;border:1px solid var(--border);background:var(--bg);" />
                    </div>
                </div>
            `,
            onConfirm: async () => {
                const newTitle = document.getElementById('course-title').value;
                const newPlatform = document.getElementById('course-platform').value;
                const newProgress = parseInt(document.getElementById('course-progress').value) || 0;
                const newLink = document.getElementById('course-link').value;
                if (isEdit) {
                    await this.updateCourse(id, { title: newTitle, platform: newPlatform, progress: newProgress, link: newLink });
                } else {
                    await this.createCourse(newTitle, newPlatform, newProgress, newLink);
                }
            },
        });

        window.NuckleoModals.show(modal);
    },
};

window.NuckleoCourses = NuckleoCourses;

document.addEventListener('DOMContentLoaded', () => NuckleoCourses.init());
    </script>
</body>
</html>
